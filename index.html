<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CollabSphere · IITM BS Community</title>
<style>
:root{--bg:#080B14;--navy:#0D1224;--s1:#141A2E;--s2:#1A2238;--cy:#45E3FF;--vi:#8B7CFF;--bl:#668CFF;--ok:#43D9A3;--warn:#FFBF69;--err:#FF6B81;--t1:#F5F7FF;--t2:#A4AEC6;--t3:#737F9B;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t1);font:16px/1.55 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.demo{background:var(--warn);color:#080B14;text-align:center;font-size:13px;padding:4px 8px}
[data-theme=light]{--bg:#F5F7FF;--navy:#FFFFFF;--s1:#FFFFFF;--s2:#D5DCF0;--cy:#0A6F8C;--vi:#5B4BD6;--bl:#3355CC;--ok:#0B7A55;--err:#C2223D;--t1:#0B1020;--t2:#2F3A55;--t3:#4A5675;color-scheme:light}
[data-theme=light] .btn.pri{color:#fff}[data-theme=light] .tag{color:#7A4B00;background:#FFF0D6}svg text{fill:var(--t1)}
.corner{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative}.pop{position:absolute;right:0;top:52px;width:min(340px,92vw);z-index:20;box-shadow:0 10px 30px #0006}.pop[hidden]{display:none}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--cy);border:1px solid var(--s2);background:var(--s1);padding:4px 12px;border-radius:99px;margin-bottom:14px}
.grad{background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:18px}
.auth{display:grid;gap:24px}@media(min-width:800px){.auth{grid-template-columns:1fr 1.1fr;align-items:start}}
.authside{background:linear-gradient(160deg,var(--s1),var(--s2));border:1px solid var(--s2);border-radius:16px;padding:24px}.authside li{color:var(--t2);margin:8px 0}
body{background:radial-gradient(900px 500px at 85% -10%,#8B7CFF24,transparent),radial-gradient(700px 400px at 0% 0%,#45E3FF18,transparent),var(--bg)}
article.card{transition:transform .2s,border-color .2s}article.card:hover{border-color:var(--bl);transform:translateY(-2px)}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--s2);background:var(--navy)}
.logo{font-weight:700;color:var(--cy)}nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav button{background:none;border:0;color:var(--t2);padding:10px 12px;border-radius:8px;cursor:pointer;font:inherit;white-space:nowrap}
nav button[aria-current=page]{background:var(--s2);color:var(--t1);box-shadow:inset 0 -2px var(--cy)}
main{max-width:1000px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:clamp(30px,6vw,52px);line-height:1.1;margin:0 0 12px;letter-spacing:-.02em}h2{font-size:22px;margin:0 0 8px}
p{color:var(--t2);max-width:62ch}.muted{color:var(--t3);font-size:13px}
.hero{display:grid;gap:24px;grid-template-columns:1fr;align-items:center}@media(min-width:760px){.hero{grid-template-columns:1.2fr 1fr}}
.card{background:var(--s1);border:1px solid var(--s2);border-radius:14px;padding:16px;margin:12px 0}
.btn{border:1px solid var(--bl);background:none;color:var(--t1);padding:10px 16px;border-radius:10px;cursor:pointer;font:inherit;min-height:44px}
.btn:hover{background:var(--s2)}.btn.pri{border:0;color:#080B14;font-weight:600;background:linear-gradient(90deg,var(--cy),var(--vi))}
.chip{border:1px solid var(--s2);background:var(--s1);color:var(--t2);padding:8px 14px;border-radius:99px;cursor:pointer;font:inherit;margin:0 6px 6px 0}.chip[aria-pressed=true]{border-color:var(--cy);color:var(--cy)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--s2);color:var(--warn)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.bar{height:8px;background:var(--s2);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--vi));transition:width .7s}
label{display:block;font-size:13px;color:var(--t2);margin:10px 0 4px}input,textarea,select{width:100%;background:var(--navy);color:var(--t1);border:1px solid var(--s2);border-radius:8px;padding:10px;font:inherit}
svg{max-width:100%}.orbit{transform-origin:150px 150px;animation:o 30s linear infinite}@keyframes o{to{transform:rotate(360deg)}}
.pulse{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.35}}
.mapwrap{display:grid;gap:16px}@media(min-width:800px){.mapwrap{grid-template-columns:1.3fr 1fr}}
.node{cursor:pointer}.ok{color:var(--ok)}.er{color:var(--err)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--cy);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .3s}#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="demo" role="status">Demo mode: every student, venue, event and count here is fictional. No live AI or location data is used.</div>
<header><span class="logo">CollabSphere <span style="font-weight:500;color:var(--t2)">· IITM BS Community</span></span><nav id="nav" aria-label="Primary"></nav><div class="corner" id="corner"></div></header>
<main id="app" tabindex="-1"></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const HOUSES=["Kanha","Nilgiri","Namdapha","Kaziranga","Gir","Sunderbans","Saranda","Wayanad","Bandipur","Corbett","Pichavaram","Nallamalla"];
const DEF={user:null,theme:"dark",region:"",pend:false,hp:Object.fromEntries(HOUSES.map(h=>[h,0])),vote:null,closed:false,confirmed:false,saved:[],dismissed:[],interests:["AI","Python"],checked:false,pts:{},proposal:null,t0:Date.now()};
let S;try{S={...DEF,...JSON.parse(localStorage.getItem("cs2")||"{}")}}catch(e){S={...DEF}}
const save=()=>{try{localStorage.setItem("cs2",JSON.stringify(S))}catch(e){}};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200)}
const REG={Lucknow:{x:300,y:150,n:12,i:["AI","Python","Coding"],ev:[["Lucknow AI & Coding Meetup","AI","Sat 24 Oct"],["Weekend Project Sprint","Coding","Sun 1 Nov"]]},
Delhi:{x:240,y:110,n:30,i:["Sports","Networking","AI"],ev:[["Five-a-side Football","Sports","Sun 25 Oct"]]},
Pune:{x:130,y:290,n:18,i:["Study","Python","Entrepreneurship"],ev:[["Study Group: Statistics","Study","Fri 23 Oct"]]},
Chennai:{x:210,y:400,n:25,i:["Gaming","Coding","Networking"],ev:[["Board Games Evening","Gaming","Sat 31 Oct"]]},
Kolkata:{x:420,y:240,n:9,i:["Cultural","Study"],ev:[["Cultural Open Mic","Cultural","Sat 7 Nov"]]},Dubai:{x:60,y:60,n:7,i:["Networking","AI"],ev:[["Co-working Morning (demo)","Study","Sat 14 Nov"]]},Singapore:{x:500,y:430,n:6,i:["Coding","Python"],ev:[["Coding Co-working (demo)","Coding","Sun 15 Nov"]]}};
const VEN=[["Demo Venue A: co-working hall",250,30,true],["Demo Venue B: campus-style lounge",150,20,true],["Demo Venue C: café meeting room",400,15,false],["Demo Venue D: library seminar room",100,25,true]];
const SEED={0:5,1:3,2:2,3:1};let DB=null,ME=null,PRE={},AUTH=null;const LIM=3;
const TERM=()=>{const d=new Date();return d.getFullYear()+"-T"+(Math.floor(d.getMonth()/4)+1)};
const used=()=>DB?Object.values(S.apr||{}).filter(a=>a.s==="Approved"&&a.by===ME.id&&a.term===TERM()).length+(S.evs||[]).filter(e=>e.by===ME.id&&e.term===TERM()).length:(S.aprl||[]).filter(t=>t===TERM()).length;
async function H(pw,salt){const enc=new TextEncoder(),k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:100000,hash:"SHA-256"},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const DEADLINE=()=>DB?Infinity:S.t0+48*3600e3;
const counts=()=>{const c=VEN.map((_,i)=>SEED[i]);if(DB)(S.vv||[]).forEach(i=>c[i]++);else if(S.vote!==null)c[S.vote]++;return c};
function outcome(){const c=counts(),m=Math.max(...c),top=c.flatMap((v,i)=>v===m?[i]:[]);return top.length>1?{ph:"RUNOFF REQUIRED",tied:top}:{ph:S.confirmed?"VENUE CONFIRMED":"AWAITING CONFIRMATION",w:top[0]}}
const phase=()=>{if(S.confirmed)return"VENUE CONFIRMED";if(!S.closed&&Date.now()<DEADLINE())return"VOTING OPEN";return outcome().ph};
const PAGES={
home(){return`<section class="hero"><div><p class="muted">${S.user?esc(S.user.name)+(S.user.house?" · House "+esc(S.user.house):""):""}</p><span class="eyebrow">IITM BS Community</span><h1>Your Community Is <span class="grad">Closer Than You Think.</span></h1><p class="lead">Discover people. Find your circle. Build something real. Follow one journey: discover, match, plan, vote, meet, verify, recognize.</p>
<button class="btn pri" data-go="map">Explore the Community Pulse</button> <button class="btn" data-go="venue">Vote on a venue</button></div>
<svg viewBox="0 0 300 300" role="img" aria-label="Community Orb: illustrative network of Lucknow, Delhi, Pune, Chennai and Kolkata. Not a location tracker."><g class="orbit">${Object.keys(REG).map((k,i)=>{const a=i*72*Math.PI/180,x=150+105*Math.sin(a),y=150-105*Math.cos(a);return`<line x1="150" y1="150" x2="${x}" y2="${y}" stroke="#668CFF" stroke-opacity=".4"/><circle cx="${x}" cy="${y}" r="16" fill="#1A2238" stroke="#8B7CFF"/><text x="${x}" y="${y+3}" font-size="7" text-anchor="middle" fill="#F5F7FF">${k}</text>`}).join("")}</g><circle class="pulse" cx="150" cy="150" r="38" fill="#45E3FF" fill-opacity=".15" stroke="#45E3FF"/><text x="150" y="154" text-anchor="middle" font-size="11" fill="#F5F7FF">Community</text></svg></section>
<div class="grid"><article class="card"><h2>Next event</h2><p>Lucknow AI &amp; Coding Meetup, Sat 24 Oct <span class="tag">demo</span></p><p class="muted">Venue poll: ${phase()}</p></article>
<article class="card"><h2>Community activity</h2><ul>${actList()}</ul><p class="muted">Counts only. No names or locations are shown.</p></article><article class="card"><h2>Upcoming events</h2>${evList()||'<p class="muted">No admin-published events yet.</p>'}</article><article class="card"><h2>Your passport</h2><p>${(S.user&&S.pts[S.user.name])||0} points · ${S.user&&S.pts[S.user.name]!==undefined?"1 verified meetup":"no verified check-ins yet"}</p></article></div>`},
map(){return`<span class="eyebrow">Community Pulse</span><h1 style="font-size:34px">Where your community gathers</h1><p>Regional clusters from demo data. Counts are aggregated and fictional; no individual locations are shown.</p>
<div role="group" aria-label="Category filters" id="chips">${["All","AI","Coding","Sports","Study","Gaming","Cultural"].map(c=>`<button class="chip" aria-pressed="${(window.F||"All")===c}" data-f="${c}">${c}</button>`).join("")}</div>
<div class="mapwrap"><svg id="map" viewBox="0 0 560 480" role="img" aria-label="Schematic map of regional clusters; a list with the same data follows." style="background:var(--navy);border-radius:14px;border:1px solid var(--s2)"><g id="mg">${Object.entries(REG).map(([k,r])=>{const on=!window.F||window.F==="All"||r.i.includes(window.F)||r.ev.some(e=>e[1]===window.F);return`<g class="node" tabindex="0" role="button" aria-label="${k}, ${r.n} opted-in demo students" data-r="${k}" opacity="${on?1:.2}"><circle class="pulse" cx="${r.x}" cy="${r.y}" r="${10+r.n/2}" fill="#45E3FF" fill-opacity=".2"/><circle cx="${r.x}" cy="${r.y}" r="8" fill="#8B7CFF"/><text x="${r.x}" y="${r.y-14-r.n/2}" font-size="12" text-anchor="middle" fill="#F5F7FF">${k}</text></g>`}).join("")}</g></svg>
<aside class="card" id="panel" aria-live="polite"><p>Select a cluster to zoom in and see events and interests.</p></aside></div>
<h2 style="margin-top:20px">List view</h2><div class="grid">${Object.entries(REG).map(([k,r])=>`<article class="card"><h3 style="margin:0">${k} <span class="tag">${r.n} demo students</span></h3><p>${r.i.join(", ")}</p></article>`).join("")}</div>`},
match(){const I=["AI","Python","Coding","Sports","Study","Gaming","Networking"];
const recs=Object.entries(REG).map(([k,r])=>{const sh=r.i.filter(x=>S.interests.includes(x));return{k,sh,n:r.n,score:sh.length*10+Math.min(r.n,20)/2}}).filter(r=>r.sh.length&&!S.dismissed.includes(r.k)).sort((a,b)=>b.score-a.score);
return`<span class="eyebrow">AI Community Matchmaker</span><h1 style="font-size:34px">Find your circle</h1><p>Deterministic matching on shared interests plus region size. Counts are <b>simulated demo statistics</b>, not database counts. Similar interests do not imply availability.</p>
<div role="group" aria-label="Your interests">${I.map(x=>`<button class="chip" aria-pressed="${S.interests.includes(x)}" data-i="${x}">${x}</button>`).join("")}</div>
${recs.map(r=>`<article class="card"><h2>${r.sh[0]} Builders Circle: ${r.k}</h2><p><b>Why:</b> ${r.n} demo students in ${r.k} list interests including ${r.sh.join(", ")}, which match yours. This is a suggestion, not a confirmed gathering.</p>
<button class="btn pri" data-prop="${r.k}|${r.sh[0]}">Turn into proposal</button> <button class="btn" data-sv="${r.k}">${S.saved.includes(r.k)?"Saved ✓":"Save"}</button> <button class="btn" data-dis="${r.k}">Dismiss</button></article>`).join("")||`<div class="card"><p>No matches. Pick more interests above.</p></div>`}`},
copilot(){const p=S.proposal;return`<span class="eyebrow">AI Copilot</span><h1 style="font-size:34px">Plan a meetup in one sentence</h1><p class="tag" style="display:inline-block">${p&&p.ai?p.ai:"Demo AI: generated using local fallback templates. No live AI service was called."}</p>
<div role="group" aria-label="Quick prompts" style="margin-top:12px">${["Plan a coding meetup for 20 students in Lucknow this Saturday with a budget of ₹400 per person","Organize a sports session for 12 students in Delhi, budget ₹100","Create a study group for 8 students in Pune, budget ₹0"].map(q=>`<button class="chip" data-q="${esc(q)}">${esc(q.slice(0,34))}…</button>`).join("")}</div>
<form id="cf"><label for="cq">Describe the event</label><textarea id="cq" rows="3" required>${esc(window.Q||"")}</textarea><button class="btn pri" style="margin-top:10px">Generate proposal</button></form>
${p?`<form class="card" id="pf"><h2>Editable proposal <span class="tag">${p.status}</span></h2>
<label for="pt">Title</label><input id="pt" value="${esc(p.title)}"><label for="pd">Description</label><textarea id="pd" rows="2">${esc(p.desc)}</textarea>
<div class="grid"><div><label for="pn">Target participants</label><input id="pn" type="number" min="2" value="${p.n}"></div><div><label for="pb">Budget per person (₹)</label><input id="pb" type="number" min="0" value="${p.b}"></div></div>
<label for="pa">Agenda</label><textarea id="pa" rows="4">${esc(p.agenda)}</textarea>
<p class="muted">Estimated total: ₹${p.n*p.b} (demo estimate). Venue criteria: accessible, capacity ≥ ${p.n}, within budget. Checklist: confirm venue, open registration, open check-in.</p>
<button type="button" class="btn" data-ai>Improve with Claude</button> <button class="btn pri" ${p.status!=="Draft"&&p.status!=="Changes requested"?"disabled":""}>Submit for approval</button><p class="muted">AI never approves or publishes. An authorized organizer must approve.</p></form>`:""}`},
venue(){const c=counts(),tot=c.reduce((a,b)=>a+b,0),ph=phase(),open=ph==="VOTING OPEN",o=outcome(),left=Math.max(0,DEADLINE()-Date.now());
return`<span class="eyebrow">VenueVote · Lucknow AI &amp; Coding Meetup</span><h1 style="font-size:34px">Vote for where we meet</h1>
<p><b style="color:var(--cy)">${ph}</b> · ${DB?"closes when the organizer closes voting":`closes in ${Math.floor(left/3600e3)}h ${Math.floor(left%3600e3/60e3)}m (demo deadline)`}. Totals are computed by one function, not by the page layout. Venues are fictional.</p>
${VEN.map((v,i)=>{const pct=Math.round(c[i]/tot*100);return`<article class="card"><div style="display:flex;justify-content:space-between;gap:8px"><h2>${v[0]}</h2><b>${c[i]} votes · ${pct}%</b></div><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${v[0]}"><i style="width:${pct}%"></i></div>
<p class="muted">Est. ₹${v[1]} per person (demo) · capacity ${v[2]} · accessibility ${v[3]?"listed":"unverified"} · availability unverified</p>
<button class="btn" data-v="${i}" ${open?"":"disabled"}>${S.vote===i?"Your vote ✓":S.vote===null?"Vote":"Change vote to this"}</button></article>`}).join("")}
<div class="card"><p>Tie policy: tied venues trigger a runoff; no silent pick. Winner needs organizer confirmation and passes suitability checks.</p>
${open?`${isAdmin()?`<button class="btn" data-close>Close voting</button>`:"The organizer closes voting."}`:o.tied?`<p class="er">Tie between ${o.tied.map(i=>VEN[i][0]).join(" and ")}: runoff required.</p>`:`<p class="ok">Community winner: ${VEN[o.w][0]}.${!VEN[o.w][3]?` <span class="er">Accessibility is unverified, a mandatory check. Organizer must resolve it or use the fallback (next-highest venue), never silently.</span>`:""}</p>${S.confirmed||!isAdmin()?"":`<button class="btn pri" data-conf>Confirm venue as organizer</button>`}`}
${DB?"":`<button class="btn" data-reset style="float:right">Reset demo</button>`}</div>`},
peers(){const me=S.mypeer||{},city=window.PC||me.city||"Lucknow",mine=S.interests,IN=["AI","Python","Coding","Sports","Study","Gaming","Networking"];
const list=(DB?(S.pr||[]):DEMO_PEERS).filter(p=>p.city===city&&!(DB&&p.id===ME.id)).map(p=>({...p,sh:p.interests.filter(x=>mine.includes(x))})).filter(p=>p.sh.length).sort((a,b)=>b.sh.length-a.sh.length);
return`<span class="eyebrow">Local Peers</span><h1 style="font-size:34px">Find peers in ${city} who share your interests</h1><p>Only students who opt in appear here, with a nickname, house and interests. No email, roll number or exact location is shown. ${DB?"":"<b>Demo mode: the peers listed are fictional.</b>"}</p>
<div role="group" aria-label="Your interests">${IN.map(x=>`<button class="chip" aria-pressed="${mine.includes(x)}" data-pin="${x}">${x}</button>`).join("")}</div>
<form class="card" id="pf2"><h2>Your peer profile</h2><label for="pn2">Nickname (not your real name or roll number)</label><input id="pn2" required maxlength="24" value="${esc(me.nick||"")}"><label for="pc">City</label><select id="pc">${Object.keys(REG).map(k=>`<option ${k===city?"selected":""}>${k}</option>`).join("")}</select><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input id="po" type="checkbox" style="width:auto" ${me.on?"checked":""}>Show me to peers in my city</label><button class="btn pri" style="margin-top:12px">Save</button></form>
<div role="group" aria-label="City">${Object.keys(REG).map(k=>`<button class="chip" aria-pressed="${k===city}" data-pc="${k}">${k}</button>`).join("")}</div>
<div class="grid">${list.map(p=>`<article class="card"><h2>${esc(p.nick)}</h2><p class="muted">House ${esc(p.house||"?")} · ${city}</p><p>Shared: ${p.sh.map(i=>`<span class="tag">${esc(i)}</span>`).join(" ")}</p><button class="btn pri" data-pi="${esc(p.nick)}|${p.sh[0]}|${city}">Invite to collaborate</button></article>`).join("")||`<div class="card"><p>No matching peers yet in ${city}. Select more interests, or invite friends to opt in.</p></div>`}</div>`},
discover(){const all=[...new Set(Object.values(REG).flatMap(r=>r.i))],f=window.DI||"All";
const rows=Object.entries(REG).map(([c,r])=>({c,st:ST[c],n:r.n,i:r.i})).filter(x=>f==="All"||x.i.includes(f)),multi=f!=="All"&&rows.length>1;
return`<span class="eyebrow">Discover Peers</span><h1 style="font-size:34px">Meet peers across states who share your interest</h1><p>Pick an interest area to see which states have opted-in students who care about it. Counts are <b>simulated demo statistics</b>, aggregated, so no individual is shown. A suggestion is not a confirmed meetup.</p>
<div role="group" aria-label="Interest areas">${["All",...all].map(x=>`<button class="chip" aria-pressed="${f===x}" data-di="${x}">${x}</button>`).join("")}</div>
<div class="grid">${rows.map(x=>`<article class="card"><h2>${x.st}</h2><p class="muted">${x.c} area · ${x.n} demo students</p><p>Interests: ${x.i.map(i=>`<span class="tag">${i}</span>`).join(" ")}</p>${multi?`<button class="btn pri" data-co="${x.c}|${f}">Collaborate on ${f} with other states</button>`:""}</article>`).join("")}</div>

if(a){if(await H(pw,a.salt)!==a.hash)return toast("Incorrect password")}
else{if(pw.length<8)return toast("Use at least 8 characters");const salt=crypto.randomUUID();a=S.acct[m]={salt,hash:await H(pw,salt),house:$("#lh").value}}
S.user={email:m,name:m.split("@")[0],house:a.house,role:"student"};save();toast("Signed in");go("home")}
function hostLine(e,id){return e.host?`<br><span class="muted">Host: ${esc(e.host)}${(e.co||[]).map(c=>` · ${esc(c.h)} ${c.ok?"✓ confirmed":"(invited)"}${isAdmin()&&!c.ok?` <button class="btn" data-cha="${id}|${esc(c.h)}">Mark accepted</button>`:""}`).join("")}</span>`:""}
function ckAdmin(){const w=S.ckw||{},on=w.open&&Date.now()<w.exp;return`<article class="card"><h2>Check-in window</h2>${on?`<div id="qr" style="background:#fff;padding:10px;display:inline-block"></div><p>Code: <b>${window.CODE||"(opened on another device)"}</b>. Expires ${new Date(w.exp).toLocaleTimeString()}.</p><button class="btn" data-cko="0">Close check-in</button>`:`<p class="muted">Closed. Opening shows a QR code (valid 10 minutes) that students scan or type.</p><button class="btn pri" data-cko="1">Open check-in and show QR</button>`}</article>`}
function ckForm(){if(S.pts[S.user.name]!==undefined)return"<p class='ok'>Verified ✓</p>";if(S.pend)return"<p>Code accepted. Waiting for admin verification.</p>";const c=S.ckw||{};if(!S.confirmed)return"<p class='muted'>Check-in opens after the organizer confirms a venue.</p>";
if(!c.open||Date.now()>c.exp)return"<p class='muted'>The organizer has not opened check-in.</p>";
return`<form id="cf2"><label for="cc">Code from the organizer's QR</label><input id="cc" required inputmode="numeric" maxlength="6" autocomplete="off"><label for="cph">Optional photo proof</label><input id="cph" type="file" accept="image/*" capture="environment"><button class="btn pri" style="margin-top:10px">Submit check-in</button></form><button class="btn" data-scan style="margin-top:8px">Scan QR with camera</button><video id="vid" hidden playsinline style="width:100%;margin-top:8px"></video>`}
async function scan(){if(!window.BarcodeDetector)return toast("Camera scanning isn't supported here. Type the code instead.");try{const v=$("#vid"),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});v.srcObject=st;v.hidden=false;await v.play();const bd=new BarcodeDetector({formats:["qr_code"]});const t=setInterval(async()=>{const r=await bd.detect(v).catch(()=>[]);if(r[0]){$("#cc").value=r[0].rawValue.replace("COLLAB:","");st.getTracks().forEach(x=>x.stop());v.hidden=true;clearInterval(t)}},400)}catch(e){toast("Camera unavailable. Type the code instead.")}}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=240/i.width,c=document.createElement("canvas");c.width=240;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.6))};i.onerror=()=>r("");i.src=URL.createObjectURL(f)})}
async function cf2(){const c=S.ckw||{},code=$("#cc").value.trim();if(!c.open||Date.now()>c.exp)return toast("Check-in is closed");if(await H(code,"checkin")!==c.h)return toast("Wrong or expired code");
const f=$("#cph").files[0],photo=f?await shrink(f):"",rec={name:S.user.name,house:S.user.house,at:Date.now(),via:"qr-code",photo};
if(DB)DB.doc("checkins/"+ME.id).set(rec).then(()=>toast("Code accepted. Waiting for admin verification.")).catch(()=>toast("Not allowed: ask the owner for Contributor access"));else{S.pend=rec;save();toast("Code accepted. Waiting for admin verification.");go("pass")}}
async function aiImprove(){const sm=window.claude?await claude.use("sample"):null;if(!sm)return toast("Live AI isn't available here. The local template is kept.");
const p={...S.proposal,title:$("#pt").value,desc:$("#pd").value,agenda:$("#pa").value};toast("Asking Claude...");
try{const r=await sm.json(`You help IITM BS students plan community meetups. Improve this draft event proposal. Return ONLY JSON: {"title":string up to 70 chars,"desc":string up to 300 chars,"agenda":string with 4 to 6 lines separated by newlines}. Never say anything is confirmed. Draft: ${JSON.stringify({title:p.title,desc:p.desc,n:p.n,b:p.b,agenda:p.agenda})}`);
if(!r||typeof r.title!=="string"||typeof r.desc!=="string"||typeof r.agenda!=="string")throw 0;
S.proposal={...p,title:r.title.slice(0,70),desc:r.desc.slice(0,300),agenda:r.agenda,ai:"Generated live by Claude. Review and edit before submitting."};save();go("copilot")}catch(e){toast("The AI request failed or was declined. Your draft is unchanged.")}}
const DEMO_PEERS=[{id:"d1",nick:"Aarav (demo)",city:"Lucknow",house:"Kanha",interests:["AI","Python"]},{id:"d2",nick:"Meera (demo)",city:"Lucknow",house:"Gir",interests:["Coding","Python","Study"]},{id:"d3",nick:"Kabir (demo)",city:"Lucknow",house:"Corbett",interests:["Sports","Gaming"]},{id:"d4",nick:"Isha (demo)",city:"Lucknow",house:"Wayanad",interests:["AI","Networking"]},{id:"d5",nick:"Rohan (demo)",city:"Delhi",house:"Nilgiri",interests:["AI","Sports"]}];
function savePeer(){const nick=$("#pn2").value.trim(),city=$("#pc").value,on=$("#po").checked;S.mypeer={nick,city,on};window.PC=city;save();
if(DB){(on?DB.doc("peers/"+ME.id).set({nick,city,house:S.user.house||"",interests:S.interests,at:Date.now()}):DB.doc("peers/"+ME.id).delete()).then(()=>{toast(on?"You are visible to peers in "+city:"You are hidden from peers");setTimeout(()=>go("peers"),300)}).catch(()=>toast("Not allowed: ask the owner for Contributor access"));return}
toast(on?"Saved. Demo mode: only you can see this.":"Hidden");go("peers")}
const allEv=()=>DB?(S.evs||[]):(S.evl||[]);
function evList2(){return allEv().map((e,i)=>{const id=e.id||"l"+i,has=(S.myrg||[]).includes(id),cnt=DB?(S.rgc||{})[id]||0:(has?1:0);
return`<p><b>${esc(e.title)}</b><br><span class="muted">${esc(e.cat||"Community")} · ${esc(e.city||"City TBA")} · ${esc(e.date||"Date TBA")} · ${cnt} of ${e.cap} registered</span>${hostLine(e,id)}${isAdmin()?"":`<br><button class="btn" data-rg="${id}" ${!has&&cnt>=e.cap?"disabled":""}>${has?"Cancel registration":"Register"}</button>`}</p>`}).join("")}
function actList(){const n=allEv().length,v=counts().reduce((a,b)=>a+b,0)-11,k=Object.keys(S.pts||{}).length,top=[...HOUSES].sort((a,b)=>S.hp[b]-S.hp[a])[0];
return[`${n} event(s) published`,`${v} venue vote(s) cast (plus 11 fictional seed votes)`,`${k} attendance(s) verified`,S.hp[top]>0?`${top} leads the house leaderboard`:"No house has points yet"].map(x=>`<li>${x}</li>`).join("")}
const ST={Dubai:"UAE (abroad)",Singapore:"Singapore (abroad)",Lucknow:"Uttar Pradesh",Delhi:"Delhi",Pune:"Maharashtra",Chennai:"Tamil Nadu",Kolkata:"West Bengal"};
function evList(){return evList2();return(DB?(S.evs||[]):(S.evl||[])).map(e=>`<p><b>${esc(e.title)}</b><br><span class="muted">${esc(e.cat)} · ${esc(e.city)} · ${esc(e.date)} · capacity ${e.cap}</span></p>`).join("")}
function mkEvent(){if(!isAdmin())return;if(used()>=LIM)return toast("Limit reached: each admin can create or approve 3 meetups per term");
const ev={title:$("#et").value.trim(),city:$("#ec").value,cat:$("#eg").value,date:$("#ed").value,cap:+$("#en").value,host:$("#eho").value,co:[...document.querySelectorAll(".ch:checked")].filter(x=>x.value!==$("#eho").value).map(x=>({h:x.value,ok:false})),by:DB?ME.id:"local",term:TERM(),at:Date.now()};
if(DB){DB.doc("meta/ev-"+Date.now()).set(ev).then(()=>toast("Event published")).catch(()=>toast("Action refused by the database"))}
else{S.evl=[...(S.evl||[]),ev];S.aprl=[...(S.aprl||[]),TERM()];save();toast("Event published");go("admin")}}
function authWrap(h){return`<div class="auth"><aside class="authside"><span class="eyebrow">CollabSphere 2.0</span><h2 style="font-size:28px">Discover people. Find your circle. Build something real.</h2><ul><li>Vote on where your community meets</li><li>Earn points for your house</li><li>Build your verified Community Passport</li></ul><p class="muted">Sign in with your IITM BS student email and a password of 8 or more characters.</p></aside><div>${h}</div></div>`}
const SHOWPW=`<label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" style="width:auto" onchange="this.closest('form').querySelectorAll('#lp,#lpw').forEach(i=>i.type=this.checked?'text':'password')">Show password</label>`;
async function init(){try{if(!window.claude)return;const u=await claude.use("user"),d=await claude.use("db");if(!u||!d)return;ME=await u.me();if(!ME||!ME.id)return;const adm=await u.canEdit();DB=d;
S.apr={};S.vv=[];S.cq=[];S.pq=[];S.pend=false;S.hp=Object.fromEntries(HOUSES.map(h=>[h,0]));S.pts={};S.user=null;
PRE={admin:adm,house:""};if(!adm){const p=await DB.doc("profiles/"+ME.id).get();if(p.exists)PRE.house=p.data().house}try{const a=await DB.collection("data/users/"+ME.id).doc("auth").get();AUTH=a.exists?a.data():null}catch(e){AUTH=null}
const L=(c,fn)=>DB.collection(c).onSnapshot(s=>{fn(s.docs);if(["venue","houses","admin","pass","home"].includes(cur))go(cur)},()=>{});
L("votes",ds=>{S.vv=ds.map(x=>x.data().venue);const m=ds.find(x=>x.id===ME.id);S.vote=m?m.data().venue:null});
L("verified",ds=>{S.hp=Object.fromEntries(HOUSES.map(h=>[h,0]));S.pts={};ds.forEach(x=>{const v=x.data();if(S.hp[v.house]!==undefined)S.hp[v.house]+=10;S.pts[v.name]=(S.pts[v.name]||0)+10})});
L("checkins",ds=>{S.cq=ds.map(x=>({id:x.id,...x.data()}));const m=ds.find(x=>x.id===ME.id);S.pend=m?m.data():false});
L("proposals",ds=>{S.pq=ds.map(x=>({id:x.id,...x.data()}));const m=S.pq.find(x=>x.id===ME.id);if(m)S.proposal={...m,status:pstat(m)}});
L("approvals",ds=>{S.apr={};ds.forEach(x=>S.apr[x.id]=x.data());const m=(S.pq||[]).find(x=>x.id===ME.id);if(m)S.proposal={...m,status:pstat(m)}});
L("peers",ds=>{S.pr=ds.map(x=>({id:x.id,...x.data()}));const m=S.pr.find(x=>x.id===ME.id);S.mypeer=m?{nick:m.nick,city:m.city,on:true}:{...(S.mypeer||{}),on:false}});
L("regs",ds=>{S.rgc={};ds.forEach(x=>(x.data().ev||[]).forEach(id=>S.rgc[id]=(S.rgc[id]||0)+1));const m=ds.find(x=>x.id===ME.id);S.myrg=m?(m.data().ev||[]):[]});
L("meta",ds=>{S.evs=ds.filter(x=>x.id.startsWith("ev-")).map(x=>({id:x.id,...x.data()}));S.ckw=(ds.find(x=>x.id==="checkin")||{data:()=>({})}).data();const m=ds.find(x=>x.id==="event");if(m){S.closed=!!m.data().closed;S.confirmed=!!m.data().confirmed}})}catch(e){DB=null}}
go("home");init().then(()=>{if(DB){$(".demo").textContent="Shared mode: data is saved for everyone with this link. All venues, seed votes and demo students are fictional.";go("home")}});
